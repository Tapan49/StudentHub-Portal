<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Portal - Timetable</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page-wrapper">

<div class="grid-container">
    <div class="flex-row">
        <div class="flex-col">
            <h1>STUDENTHUB PORTAL</h1>
        </div>
        <div class="flex-col">
            <a href="profile.html"><b>PROFILE</b></a> 
            <a href="home.html"><b>BACK</b></a>
        </div>
    </div>
    <div class="flex-row">
        <div class="flex-col">
            <h2>TIMETABLE</h2>
        </div>
    </div>
    <div class="flex-row">
        <div class="flex-col">
            <div class="grid-container">
                <div class="flex-row">
                    <th width="10%">TIME</th>
                    <th width="18%">MON</th>
                    <th width="18%">TUE</th>
                    <th width="18%">WED</th>
                    <th width="18%">THU</th>
                    <th width="18%">FRI</th>
                </div>
                <div class="flex-row">
                    <div class="flex-col"><b>9:00</b></div>
                    <div class="flex-col">DS</div>
                    <div class="flex-col">MATHS</div>
                    <div class="flex-col">OOP</div>
                    <div class="flex-col">DLD</div>
                    <div class="flex-col">COA</div>
                </div>
                <div class="flex-row">
                    <div class="flex-col"><b>10:00</b></div>
                    <div class="flex-col">DLD</div>
                    <div class="flex-col">COA</div>
                    <div class="flex-col">DS</div>
                    <div class="flex-col">MATHS</div>
                    <div class="flex-col">DS</div>
                </div>
                <div class="flex-row">
                    <div class="flex-col"><b>11:00</b></div>
                    <div class="flex-col"><b>LUNCH BREAK</b></div>
                </div>
                <div class="flex-row">
                    <div class="flex-col"><b>12:00</b></div>
                    <div class="flex-col">COA</div>
                    <div class="flex-col">DS LAB</div>
                    <div class="flex-col">MATHS</div>
                    <div class="flex-col">OOP LAB</div>
                    <div class="flex-col">DLD LAB</div>
                </div>
                <div class="flex-row">
                    <div class="flex-col"><b>1:00</b></div>
                    <div class="flex-col">OOP LAB</div>
                    <div class="flex-col">DS LAB</div>
                    <div class="flex-col">COA LAB</div>
                    <div class="flex-col">OOP LAB</div>
                    <div class="flex-col">DLD LAB</div>
                </div>
                <div class="flex-row">
                    <div class="flex-col"><b>2:00</b></div>
                    <div class="flex-col">OOP LAB</div>
                    <div class="flex-col">DLD</div>
                    <div class="flex-col">COA LAB</div>
                    <div class="flex-col">DS</div>
                    <div class="flex-col">MATHS</div>
                </div>
                <div class="flex-row">
                    <div class="flex-col"><b>3:00</b></div>
                    <div class="flex-col">MATHS</div>
                    <div class="flex-col">OOP</div>
                    <div class="flex-col">DLD</div>
                    <div class="flex-col">COA</div>
                    <div class="flex-col">OOP</div>
                </div>
            </div>
        </div>
    </div>
</div>

</div>
</body>
</html>
